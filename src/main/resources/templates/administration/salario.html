<!DOCTYPE html>

<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Salário</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- CSS Principal -->

    <link
        rel="stylesheet"
        href="/css/pagePrincipal.css">

</head>


<body>


    <!-- MENU LATERAL -->

    <aside class="sidebar">

        <nav>

            <ul>

                <li>
                    <a th:href="@{/administration}">
                        <i class="fa-solid fa-house"></i>
                        Início
                    </a>
                </li>


                <li>
                    <a th:href="@{/salario}">
                        <i class="fa-solid fa-sack-dollar"></i>
                        Meu salário
                    </a>
                </li>


                <li>
                    <a href="#">
                        <i class="fa-solid fa-hand-holding-dollar"></i>
                        Despesas
                    </a>
                </li>


                <li>
                    <a href="#">
                        <i class="fa-solid fa-chart-line"></i>
                        Relatórios
                    </a>
                </li>


                <li>
                    <a href="#">
                        <i class="fa-solid fa-bullseye"></i>
                        Metas
                    </a>
                </li>

            </ul>

        </nav>

    </aside>



    <!-- CONTEÚDO PRINCIPAL -->

    <main class="main">


        <!-- BARRA SUPERIOR -->

        <header class="topbar">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    placeholder="Pesquisar...">

            </div>

        </header>



        <!-- CONTEÚDO DA PÁGINA -->

        <div class="container mt-4">


            <!-- CABEÇALHO -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h1>

                        <i class="fa-solid fa-wallet"></i>

                        Meu Salário

                    </h1>


                    <p class="text-muted">

                        Cadastre e acompanhe seu salário.

                    </p>

                </div>

            </div>



            <!-- CARD -->

            <div class="card shadow-sm">


                <!-- CABEÇALHO DO CARD -->

                <div
                    class="card-header"
                    style="background-color:#2bbb50">

                    <h5
                        class="mb-0"
                        style="color:black">

                        <i
                            class="fa-solid fa-money-bill-wave"
                            style="color:#112b1e">
                        </i>

                        Cadastrar salário

                    </h5>

                </div>



                <!-- CORPO DO CARD -->

                <div class="card-body">


                    <!-- FORMULÁRIO -->

                    <form
                        th:object="${salario}"
                        method="POST">


                        <!-- VALOR DO SALÁRIO -->

                        <div class="mb-3">

                            <label
                                for="valor"
                                class="form-label">

                                Valor do salário

                            </label>


                            <div class="input-group">

                                <span class="input-group-text">

                                    R$

                                </span>
 	<input type="number" step="0.01" class="form-control" id="valor" th:field="*{valor}" placeholder="Digite seu salário" required>
  </div>
</div>
                           <!-- DATA DE RECEBIMENTO -->
<div class="mb-3">
     <label for="dataInicioVigencia" class="form-label"> Data de início do salário  </label>
     <input type="date" class="form-control" id="dataInicioVigencia" th:field="*{dataInicioVigencia}" required>
</div>
                        
                        				<!-- BOTÕES -->
<div class="d-flex justify-content-end gap-2">
                                        <!-- CANCELAR -->
<a th:href="@{/administration}" class="btn btn-secondary">
<i class="fa-solid fa-xmark"></i>Cancelar</a>
                         
                                        <!-- SALVAR -->
<button type="submit" class="btn btn-success">
<i class="fa-solid fa-floppy-disk"></i>Salvar salário</button>
</div>
</form>

      </div>
    </div>
  </div>
</main>



    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
